name: LifeApp
options:
  bundleIdPrefix: flamio
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Личная сборка: включает тестовый переключатель Flamio+ в настройках. Удалить перед публикацией.
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) PERSONAL_TEST"
targets:
  LifeApp:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: LifeWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Flamio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: flamio.ios.ipa
        TARGETED_DEVICE_FAMILY: "1"
  LifeWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Flamio
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: flamio.ios.ipa.widget
        TARGETED_DEVICE_FAMILY: "1"
